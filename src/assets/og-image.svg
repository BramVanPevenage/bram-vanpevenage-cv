<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2c4f"/>
      <stop offset="1" stop-color="#22386a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint ledger lines for the "precise document" feel -->
  <g stroke="#c9a04a" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- monogram seal -->
  <g transform="translate(100,225)">
    <rect x="0" y="0" width="180" height="180" rx="8" fill="none" stroke="#c9a04a" stroke-width="2.5"/>
    <text x="90" y="115" text-anchor="middle" font-family="Palatino, 'Palatino Linotype', Georgia, serif"
          font-size="64" letter-spacing="4" fill="#f4efe4">BVP</text>
  </g>

  <!-- headline -->
  <g font-family="Palatino, 'Palatino Linotype', Georgia, serif" fill="#f4efe4">
    <text x="340" y="300" font-size="58" font-weight="500">Bram Van Pevenage</text>
    <text x="342" y="350" font-size="26" letter-spacing="6" fill="#c9a04a">CURRICULUM VITAE</text>
  </g>

  <line x1="342" y1="375" x2="820" y2="375" stroke="#c9a04a" stroke-width="1.5"/>
</svg>
